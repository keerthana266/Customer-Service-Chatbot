<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Customer Service Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>🤖 Customer Service Chatbot</h1>
            <p>Powered by Flask + NLP + TF-IDF</p>
        </div>

        <div id="chatbox">

            <div class="bot">
                🤖 Hello! I'm your virtual assistant.
                <br>
                <small>Ask me about refunds, orders, products, pricing, and more.</small>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
